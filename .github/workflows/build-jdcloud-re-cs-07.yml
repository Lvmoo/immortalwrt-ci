name: Build OpenWrt JDCloud RE-CS-07

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'ImmortalWrt branch'
        required: false
        default: 'openwrt-24.10'
  push:
    branches:
      - main
    paths:
      - 'configs/jdcloud-re-cs-07.config'
      - '.github/workflows/build-jdcloud-re-cs-07.yml'
      - 'scripts/**'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  VIKINGYFY_URL: https://github.com/VIKINGYFY/immortalwrt
  CONFIG_FILE: configs/jdcloud-re-cs-07.config
  TARGET_NAME: jdcloud-re-cs-07
  PORTING_BRANCH: immortalwrt-jdcloud-re-cs-07
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set Script Permissions
      run: |
        chmod +x scripts/*.sh
        ls -la scripts/

    - name: Initialize Environment
      run: |
        sudo timedatectl set-timezone "$TZ"
        bash scripts/ci_common.sh install_deps

    - name: Clone Source Code
      run: |
        bash scripts/ci_common.sh clone_source "$REPO_URL" "$REPO_BRANCH"
        echo "克隆 VIKINGYFY 源码用于移植..."
        git clone --depth=1 "$VIKINGYFY_URL" vikingyfy-immortalwrt

    - name: Port Device to ImmortalWrt
      run: |
        cd immortalwrt
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        bash ../scripts/port-jdcloud-re-cs-07.sh port

    - name: Push ImmortalWrt Source to Porting Branch
      run: |
        cd immortalwrt
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git remote add current "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        git fetch current || true
        echo "推送完整源码到分支: ${{ env.PORTING_BRANCH }}"
        git push current ${{ env.PORTING_BRANCH }}:${{ env.PORTING_BRANCH }} --force
        echo "✅ 源码已推送: ${{ github.server_url }}/${{ github.repository }}/tree/${{ env.PORTING_BRANCH }}"

    - name: Generate Patch File
      run: |
        cd immortalwrt
        mkdir -p ../patches
        git format-patch -1 HEAD --stdout > ../patches/jdcloud-re-cs-07-port.patch
        ls -lh ../patches/

    - name: Save Porting Info
      run: |
        git checkout ${{ github.ref_name }}
        mkdir -p porting/jdcloud-re-cs-07
        cp patches/jdcloud-re-cs-07-port.patch porting/jdcloud-re-cs-07/ 2>/dev/null || true

        cat > porting/jdcloud-re-cs-07/README.md << 'EOFREADME'
# JDCloud RE-CS-07 移植文档

## 完整源码分支

移植后的完整 ImmortalWrt 源码位于本仓库的独立分支 `immortalwrt-jdcloud-re-cs-07`

## 方法 1: 直接使用移植分支（推荐）

### 克隆移植分支（完整源码）

```bash
git clone -b immortalwrt-jdcloud-re-cs-07 https://github.com/YOUR_USERNAME/YOUR_REPO.git
cd YOUR_REPO
```

### 更新 feeds

```bash
./scripts/feeds update -a
./scripts/feeds install -a
```

### 配置

```bash
make menuconfig
```

或使用预设配置：

```bash
wget https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/configs/jdcloud-re-cs-07.config -O .config
make defconfig
```

### 编译

```bash
make download -j$(nproc)
make -j$(nproc) || make -j1 V=s
```

## 方法 2: 应用补丁到官方源码

### 克隆官方源码

```bash
git clone -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt
cd immortalwrt
```

### 下载并应用补丁

```bash
wget https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/porting/jdcloud-re-cs-07/jdcloud-re-cs-07-port.patch
git apply jdcloud-re-cs-07-port.patch
```

### 后续步骤

```bash
./scripts/feeds update -a
./scripts/feeds install -a
make menuconfig
```

## 移植详情

### 设备信息

- **厂商**: JDCloud
- **型号**: RE-CS-07
- **SoC**: Qualcomm IPQ6010
- **存储**: eMMC
- **网络**: 4x GbE (3x LAN + 1x WAN)
- **无线**: 默认不包含

### 关键修改

1. ✅ **DTS 修复**: 将 `&sdhc` 改为 `&sdhc_1`
2. ✅ **设备配置**: 添加到 `target/linux/qualcommax/image/ipq60xx.mk`
3. ✅ **网络配置**: LAN (lan1/lan2/lan3) + WAN
4. ✅ **eMMC 支持**: 升级脚本配置
5. ✅ **清理冲突**: 移除 luci-app-cpufreq

### 文件位置

```
target/linux/qualcommax/
├── files/arch/arm64/boot/dts/qcom/
│   ├── ipq6010-re-cs-07.dts
│   ├── ipq6018-ess.dtsi
│   ├── ipq6018-nss.dtsi
│   └── ipq6018-common.dtsi
├── image/ipq60xx.mk
├── ipq60xx/base-files/
│   ├── etc/board.d/02_network
│   └── lib/upgrade/platform.sh
└── Makefile
```

