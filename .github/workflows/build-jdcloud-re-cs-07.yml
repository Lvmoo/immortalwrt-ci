- [补丁文件](jdcloud-re-cs-07-port.patch)
- [配置文件](../../blob/main/configs/jdcloud-re-cs-07.config)
- [固件下载](../../releases)
- [官方 ImmortalWrt](https://github.com/immortalwrt/immortalwrt)
EOFREADME

    - name: Commit to Main Branch
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add porting/ patches/
        git diff --cached --quiet || git commit -m "Update porting info [skip ci]" && git push origin ${{ github.ref_name }}

    - name: Upload Patch Artifact
      uses: actions/upload-artifact@v4
      with:
        name: patch_${{ github.run_number }}
        path: patches/jdcloud-re-cs-07-port.patch

    - name: Update and Install Feeds
      run: |
        cd immortalwrt
        bash ../scripts/ci_common.sh update_feeds

    - name: Load Custom Configuration
      run: |
        cd immortalwrt
        cp ../$CONFIG_FILE .config
        make defconfig

    - name: Download Packages
      run: |
        cd immortalwrt
        make download -j$(nproc)
        find dl -size -1024c -exec rm -f {} \;

    - name: Build Firmware
      run: |
        cd immortalwrt
        bash ../scripts/ci_build.sh build

    - name: Check Build Space
      if: always()
      run: df -hT

    - name: Organize Firmware
      if: env.UPLOAD_FIRMWARE == 'true'
      run: |
        cd immortalwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y%m%d-%H%M")" >> $GITHUB_ENV

    - name: Upload Firmware Artifact
      if: env.UPLOAD_FIRMWARE == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: firmware_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE_PATH }}

    - name: Generate Release
      if: env.UPLOAD_RELEASE == 'true'
      run: |
        echo "RELEASE_TAG=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV
        cat > release.txt << 'EOFRELEASE'
