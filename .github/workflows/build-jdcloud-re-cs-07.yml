name: Build OpenWrt JDCloud RE-CS-07

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'ImmortalWrt branch'
        required: false
        default: 'openwrt-24.10'
  push:
    branches:
      - main
    paths:
      - 'configs/jdcloud-re-cs-07.config'
      - '.github/workflows/build-jdcloud-re-cs-07.yml'
      - 'scripts/**'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  VIKINGYFY_URL: https://github.com/VIKINGYFY/immortalwrt
  CONFIG_FILE: configs/jdcloud-re-cs-07.config
  TARGET_NAME: jdcloud-re-cs-07
  PORTING_BRANCH: immortalwrt-jdcloud-re-cs-07
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set Script Permissions
      run: |
        chmod +x scripts/*.sh
        ls -la scripts/

    - name: Initialize Environment
      run: |
        sudo timedatectl set-timezone "$TZ"
        bash scripts/ci_common.sh install_deps

    - name: Clone Source Code
      run: |
        bash scripts/ci_common.sh clone_source "$REPO_URL" "$REPO_BRANCH"
        echo "克隆 VIKINGYFY 源码用于移植..."
        git clone --depth=1 "$VIKINGYFY_URL" vikingyfy-immortalwrt

    - name: Port Device to ImmortalWrt
      run: |
        cd immortalwrt
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        bash ../scripts/port-jdcloud-re-cs-07.sh port

    - name: Push ImmortalWrt Source to Porting Branch
      run: |
        cd immortalwrt
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git remote add current "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        git fetch current || true
        echo "推送完整源码到分支: ${{ env.PORTING_BRANCH }}"
        git push current ${{ env.PORTING_BRANCH }}:${{ env.PORTING_BRANCH }} --force
        echo "✅ 源码已推送: ${{ github.server_url }}/${{ github.repository }}/tree/${{ env.PORTING_BRANCH }}"

    - name: Generate Patch File
      run: |
        cd immortalwrt
        mkdir -p ../patches
        git format-patch -1 HEAD --stdout > ../patches/jdcloud-re-cs-07-port.patch
        ls -lh ../patches/

    - name: Save Porting Info
      run: |
        git checkout ${{ github.ref_name }}
        mkdir -p porting/jdcloud-re-cs-07
        cp patches/jdcloud-re-cs-07-port.patch porting/jdcloud-re-cs-07/ 2>/dev/null || true

    - name: Commit to Main Branch
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add porting/ patches/ || true
        if ! git diff --cached --quiet 2>/dev/null; then
          git commit -m "Update porting info [skip ci]"
          git push origin ${{ github.ref_name }}
        else
          echo "No changes to commit"
        fi

    - name: Upload Patch Artifact
      uses: actions/upload-artifact@v4
      with:
        name: patch_${{ github.run_number }}
        path: patches/jdcloud-re-cs-07-port.patch
        if-no-files-found: warn

    - name: Update and Install Feeds
      run: |
        cd immortalwrt
        bash ../scripts/ci_common.sh update_feeds

    - name: Load Custom Configuration
      run: |
        cd immortalwrt
        cp ../$CONFIG_FILE .config
        make defconfig

    - name: Download Packages
      run: |
        cd immortalwrt
        make download -j$(nproc)
        find dl -size -1024c -exec rm -f {} \;

    - name: Build Firmware
      run: |
        cd immortalwrt
        bash ../scripts/ci_build.sh build

    - name: Check Build Space
      if: always()
      run: df -hT

    - name: Organize Firmware
      if: env.UPLOAD_FIRMWARE == 'true'
      run: |
        cd immortalwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y%m%d-%H%M")" >> $GITHUB_ENV

    - name: Upload Firmware Artifact
      if: env.UPLOAD_FIRMWARE == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: firmware_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE_PATH }}

    - name: Generate Release
      if: env.UPLOAD_RELEASE == 'true'
      run: |
        echo "RELEASE_TAG=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV
        sed -i "s|BUILD_DATE|$(date +'%Y-%m-%d %H:%M:%S')|g" release.txt
        sed -i "s|SOURCE_BRANCH_URL|${{ github.server_url }}/${{ github.repository }}/tree/${{ env.PORTING_BRANCH }}|g" release.txt
        sed -i "s|CLONE_URL|${{ github.server_url }}/${{ github.repository }}.git|g" release.txt
        sed -i "s|REPO_DIR|$(basename ${{ github.repository }})|g" release.txt

    - name: Upload Release
      if: env.UPLOAD_RELEASE == 'true'
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.TARGET_NAME }}_${{ env.RELEASE_TAG }}
        body_path: release.txt
        files: |
          ${{ env.FIRMWARE_PATH }}/*
          patches/jdcloud-re-cs-07-port.patch
