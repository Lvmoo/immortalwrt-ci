name: Build OpenWrt JDCloud RE-CS-07 (LiBwrt NSS)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'LiBwrt NSS branch'
        required: false
        default: 'k6.12-nss'
        type: choice
        options:
          - 'k6.12-nss'
          - 'k6.6-nss'
      use_ccache:
        description: 'Enable ccache'
        required: false
        default: false
        type: boolean
      clean_cache:
        description: 'Clean all caches'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'configs/jdcloud-re-cs-07-nss.config'
      - '.github/workflows/build-jdcloud-re-cs-07-nss.yml'

permissions:
  contents: write

env:
  REPO_URL: https://github.com/LiBwrt/openwrt-6.x
  REPO_BRANCH: k6.12-nss
  CONFIG_FILE: configs/jdcloud-re-cs-07.config
  TARGET_NAME: jdcloud-re-cs-07-libwrt-nss
  PORTING_BRANCH: libwrt-jdcloud-re-cs-07-nss
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  # 缓存版本 - 如遇问题改成 v3、v4 强制刷新
  CACHE_VERSION: v2
  # ccache 配置（默认关闭，社区建议按需启用）
  USE_CCACHE: ${{ github.event.inputs.use_ccache || 'false' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Free Disk Space
      run: |
        echo "清理前磁盘空间:"
        df -h
        
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        
        echo "清理后磁盘空间:"
        df -h
        
    - name: Initialize Environment
      run: |
        sudo timedatectl set-timezone "$TZ"
        bash scripts/ci_common.sh install_deps
        
    - name: Clone LiBwrt Source
      run: |
        echo "🚀 克隆 LiBwrt/openwrt-6.x ($REPO_BRANCH)..."
        git clone --single-branch -b "$REPO_BRANCH" "$REPO_URL" openwrt
        
        cd openwrt
        echo "✅ 源码信息:"
        echo "  分支: $(git branch --show-current)"
        echo "  提交: $(git log -1 --oneline)"
        
        # 生成缓存键
        OPENWRT_COMMIT=$(git rev-parse --short HEAD)
        echo "OPENWRT_COMMIT=$OPENWRT_COMMIT" >> $GITHUB_ENV
        
        # 生成工具链特征码（用于缓存键）
        TOOLCHAIN_HASH=$(cat include/toolchain-build.mk include/kernel-*.mk 2>/dev/null | md5sum | awk '{ print $1 }')
        echo "TOOLCHAIN_HASH=$TOOLCHAIN_HASH" >> $GITHUB_ENV
        
    # 缓存 1: DL 目录（排除 go-mod-cache）
    - name: Restore DL Cache
      if: github.event.inputs.clean_cache != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          openwrt/dl
          !openwrt/dl/go-mod-cache
        key: dl-${{ env.REPO_BRANCH }}-${{ env.CACHE_VERSION }}-${{ hashFiles('openwrt/feeds.conf.default') }}
        restore-keys: |
          dl-${{ env.REPO_BRANCH }}-${{ env.CACHE_VERSION }}-
          
    # 缓存 2: Go 模块（独立缓存避免污染）
    - name: Restore Go Module Cache
      if: github.event.inputs.clean_cache != 'true'
      uses: actions/cache/restore@v4
      with:
        path: openwrt/dl/go-mod-cache
        key: go-mod-${{ env.REPO_BRANCH }}-${{ env.CACHE_VERSION }}-${{ hashFiles('openwrt/feeds/packages/net/*/Makefile') }}
        restore-keys: |
          go-mod-${{ env.REPO_BRANCH }}-${{ env.CACHE_VERSION }}-
          
    # 缓存 3: 工具链和构建工具（最重要）
    - name: Restore Toolchain Cache
      if: github.event.inputs.clean_cache != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          openwrt/staging_dir/host
          openwrt/staging_dir/hostpkg
          openwrt/staging_dir/toolchain-*
          openwrt/build_dir/host
        key: toolchain-${{ env.REPO_BRANCH }}-${{ env.CACHE_VERSION }}-${{ env.TOOLCHAIN_HASH }}
        restore-keys: |
          toolchain-${{ env.REPO_BRANCH }}-${{ env.CACHE_VERSION }}-
          
    # 缓存 4: ccache（可选，默认关闭）
    - name: Restore ccache Cache
      if: env.USE_CCACHE == 'true' && github.event.inputs.clean_cache != 'true'
      uses: actions/cache/restore@v4
      with:
        path: openwrt/.ccache
        key: ccache-${{ env.REPO_BRANCH }}-${{ env.CACHE_VERSION }}-${{ env.OPENWRT_COMMIT }}
        restore-keys: |
          ccache-${{ env.REPO_BRANCH }}-${{ env.CACHE_VERSION }}-
        
    - name: Push Source to Porting Branch
      run: |
        cd openwrt
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git remote add current "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        git fetch current || true
        
        echo "📤 推送源码到分支: ${{ env.PORTING_BRANCH }}"
        git push current HEAD:${{ env.PORTING_BRANCH }} --force
        
    - name: Generate and Commit Documentation
      run: |
        bash scripts/generate-readme-libwrt.sh "${{ github.server_url }}/${{ github.repository }}" "${{ env.PORTING_BRANCH }}"
        
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add porting/ || true
        git diff --cached --quiet || git commit -m "Update LiBwrt NSS documentation [skip ci]"
        git push origin HEAD:${{ github.ref_name }} || true
        
    - name: Setup Feeds
      run: |
        cd openwrt
        echo "📦 更新 Feeds..."
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
    - name: Load Configuration
      run: |
        cd openwrt
        if [ -f "../$CONFIG_FILE" ]; then
          echo "📋 使用自定义配置"
          cp ../$CONFIG_FILE .config
        else
          echo "⚠️ 使用默认配置"
          echo "CONFIG_TARGET_qualcommax=y" > .config
          echo "CONFIG_TARGET_qualcommax_ipq60xx=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-07=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
        fi
        
        # 根据选项启用 ccache
        if [ "$USE_CCACHE" = "true" ]; then
          echo "🚀 启用 ccache"
          echo "CONFIG_CCACHE=y" >> .config
        fi
        
        make defconfig
        
    - name: Configure ccache
      if: env.USE_CCACHE == 'true'
      run: |
        cd openwrt
        export CCACHE_DIR="$PWD/.ccache"
        mkdir -p "$CCACHE_DIR"
        
        ccache --set-config=max_size=2G
        ccache --set-config=compression=true
        ccache --set-config=compression_level=6
        
        echo "📊 ccache 配置:"
        ccache -s || true
        
    - name: Verify and Clean Cache Integrity
      run: |
        cd openwrt
        echo "🔍 检查缓存完整性..."
        
        # 清理损坏的 Go 模块缓存
        if [ -d "dl/go-mod-cache" ]; then
          echo "✅ Go 模块缓存存在: $(du -sh dl/go-mod-cache | cut -f1)"
          
          # 检查损坏标志
          CORRUPTED=$(find dl/go-mod-cache -name "*.partial" -o -name "*.tmp" -o -name "*.lock" 2>/dev/null | wc -l)
          if [ "$CORRUPTED" -gt 0 ]; then
            echo "⚠️ 发现 $CORRUPTED 个损坏文件，清理 Go 缓存"
            rm -rf dl/go-mod-cache
          fi
        fi
        
        # 清理临时目录
        rm -rf tmp/go-build 2>/dev/null || true
        rm -rf tmp/.pkginfo 2>/dev/null || true
        
        # 验证 staging_dir 权限（避免权限问题）
        if [ -d "staging_dir" ]; then
          find staging_dir -type d ! -perm -755 -exec chmod 755 {} \; 2>/dev/null || true
        fi
        
    - name: Download Dependencies
      run: |
        cd openwrt
        echo "📥 下载依赖包..."
        
        # 首次尝试并行下载
        if make download -j$(nproc) V=s 2>&1 | tee download.log; then
          echo "✅ 并行下载成功"
        else
          echo "⚠️ 并行下载失败，检查错误..."
          
          # 检查是否是 Go 模块问题
          if grep -q "no required module provides package" download.log; then
            echo "🔧 检测到 Go 模块问题，清理后重试..."
            rm -rf dl/go-mod-cache
          fi
          
          echo "🔄 使用单线程重试..."
          make download -j1 V=s
        fi
        
        # 清理下载失败的占位符
        find dl -size -1024c -exec rm -f {} \;
        
        # 统计信息
        echo ""
        echo "📊 下载统计:"
        echo "  总大小: $(du -sh dl 2>/dev/null | cut -f1)"
        if [ -d "dl/go-mod-cache" ]; then
          echo "  Go 模块: $(du -sh dl/go-mod-cache | cut -f1) ($(find dl/go-mod-cache -type f | wc -l) 文件)"
        fi
        
    - name: Build Firmware
      run: |
        cd openwrt
        echo "🔨 开始编译..."
        echo "📊 配置:"
        echo "  线程: $(($(nproc) + 1))"
        echo "  ccache: $USE_CCACHE"
        
        # 设置 ccache 环境变量
        if [ "$USE_CCACHE" = "true" ]; then
          export CCACHE_DIR="$PWD/.ccache"
          export USE_CCACHE=1
        fi
        
        # 并行编译，失败后降级
        START_TIME=$(date +%s)
        
        if make -j$(($(nproc) + 1)) V=w 2>&1 | tee build.log; then
          echo "✅ 并行编译成功"
        else
          echo "⚠️ 并行编译失败，分析错误..."
          
          # 检查是否是 Go 依赖问题
          if grep -q "no required module provides package" build.log; then
            echo "❌ Go 依赖问题，请手动清理缓存后重试"
            echo "提示: 在 workflow_dispatch 中勾选 'Clean all caches'"
            exit 1
          fi
          
          echo "🔄 使用单线程详细模式重试..."
          make -j1 V=s
        fi
        
        END_TIME=$(date +%s)
        BUILD_TIME=$((END_TIME - START_TIME))
        echo "⏱️ 编译耗时: $((BUILD_TIME / 60)) 分 $((BUILD_TIME % 60)) 秒"
        
    - name: Show Build Stats
      if: always()
      run: |
        cd openwrt
        echo "=========================================="
        echo "📊 构建统计"
        echo "=========================================="
        
        echo ""
        echo "📦 目录大小:"
        du -sh dl staging_dir build_dir tmp bin 2>/dev/null | sort -h || true
        
        if [ -d "dl/go-mod-cache" ]; then
          echo ""
          echo "📦 Go 模块缓存:"
          echo "  大小: $(du -sh dl/go-mod-cache | cut -f1)"
          echo "  文件数: $(find dl/go-mod-cache -type f | wc -l)"
        fi
        
        if [ "$USE_CCACHE" = "true" ] && [ -d ".ccache" ]; then
          echo ""
          echo "📦 ccache 统计:"
          export CCACHE_DIR="$PWD/.ccache"
          ccache -s 2>/dev/null || echo "ccache 统计失败"
        fi
        
        echo ""
        echo "💾 磁盘使用:"
        df -h | grep -E '(Filesystem|/dev/root)'
        echo "=========================================="
        
    # 仅构建成功时保存缓存
    - name: Save DL Cache
      uses: actions/cache/save@v4
      if: success() && github.event.inputs.clean_cache != 'true'
      with:
        path: |
          openwrt/dl
          !openwrt/dl/go-mod-cache
        key: dl-${{ env.REPO_BRANCH }}-${{ env.CACHE_VERSION }}-${{ hashFiles('openwrt/feeds.conf.default') }}
        
    - name: Save Go Module Cache
      uses: actions/cache/save@v4
      if: success() && github.event.inputs.clean_cache != 'true'
      with:
        path: openwrt/dl/go-mod-cache
        key: go-mod-${{ env.REPO_BRANCH }}-${{ env.CACHE_VERSION }}-${{ hashFiles('openwrt/feeds/packages/net/*/Makefile') }}
        
    - name: Save Toolchain Cache
      uses: actions/cache/save@v4
      if: success() && github.event.inputs.clean_cache != 'true'
      with:
        path: |
          openwrt/staging_dir/host
          openwrt/staging_dir/hostpkg
          openwrt/staging_dir/toolchain-*
          openwrt/build_dir/host
        key: toolchain-${{ env.REPO_BRANCH }}-${{ env.CACHE_VERSION }}-${{ env.TOOLCHAIN_HASH }}
        
    - name: Save ccache Cache
      uses: actions/cache/save@v4
      if: success() && env.USE_CCACHE == 'true' && github.event.inputs.clean_cache != 'true'
      with:
        path: openwrt/.ccache
        key: ccache-${{ env.REPO_BRANCH }}-${{ env.CACHE_VERSION }}-${{ env.OPENWRT_COMMIT }}
        
    - name: Organize Firmware
      if: env.UPLOAD_FIRMWARE == 'true'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y%m%d-%H%M")" >> $GITHUB_ENV
        
    - name: Upload Firmware Artifact
      if: env.UPLOAD_FIRMWARE == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: firmware-libwrt-nss_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE_PATH }}
        
    - name: Generate Release Info
      if: env.UPLOAD_RELEASE == 'true'
      run: |
        echo "RELEASE_TAG=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV
        bash scripts/generate-release-libwrt.sh "${{ github.server_url }}/${{ github.repository }}" "${{ env.PORTING_BRANCH }}" "$(date +'%Y-%m-%d %H:%M:%S')"
        
    - name: Upload Release
      if: env.UPLOAD_RELEASE == 'true'
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.TARGET_NAME }}_${{ env.RELEASE_TAG }}
        name: LiBwrt NSS ${{ env.RELEASE_TAG }}
        body_path: release.txt
        files: ${{ env.FIRMWARE_PATH }}/*